<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ChromeThemes</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>ChromeThemes</h1>
      <label class="switch" title="Turn theming on or off everywhere">
        <input type="checkbox" id="enabled" />
        <span></span>
      </label>
    </header>

    <section class="site" id="siteRow">
      <span class="site__host" id="host">This page</span>
      <label class="check">
        <input type="checkbox" id="siteEnabled" />
        On this site
      </label>
    </section>
    <p class="note" id="restricted" hidden>Chrome doesn’t let extensions change this page.</p>

    <section>
      <h2>Themes</h2>
      <div class="grid" id="grid"></div>
    </section>

    <section class="custom" id="custom" hidden>
      <h2>Custom theme</h2>
      <div class="fields">
        <label>Background <input type="color" id="cBg" /></label>
        <label>Text <input type="color" id="cText" /></label>
        <label>Accent <input type="color" id="cAccent" /></label>
      </div>
      <p class="note" id="contrastNote"></p>
    </section>

    <section class="options">
      <div class="row">
        <span>Colorful elements</span>
        <div class="segmented" role="radiogroup" aria-label="Colorful elements">
          <button type="button" data-accent="theme" role="radio">Theme accent</button>
          <button type="button" data-accent="site" role="radio">Site colors</button>
        </div>
      </div>
      <label class="check" id="siteOnlyRow">
        <input type="checkbox" id="siteOnly" />
        Use a different theme on this site
      </label>
    </section>

    <template id="card">
      <button type="button" class="card">
        <span class="card__swatch"><span class="card__aa">Aa</span><span class="card__dot"></span></span>
        <span class="card__name"></span>
      </button>
    </template>

    <script src="../src/color.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
